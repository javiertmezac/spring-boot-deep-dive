spring.application.name=taskflow

# Which profile is active by default. Override at runtime with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=prod
spring.profiles.active=dev

# Base values for the taskflow.* properties (bound to TaskflowProperties).
taskflow.recipient=user@taskflow.dev
taskflow.greeting=Hello from the base config

# Consumed by our custom starter's auto-configuration (taskflow-spring-boot-starter).
# Try taskflow.greeter.enabled=false to watch the bean disappear.
taskflow.greeter.name=Spring Boot Bootcamp

# --- H2 (in-memory) + JPA ---
spring.datasource.url=jdbc:h2:mem:taskflow;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Browse the DB at http://localhost:8080/h2-console (JDBC URL above)
spring.h2.console.enabled=true
# Log the SQL Hibernate generates - great for teaching ORM
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Actuator (introspect the running container) ---
# Expose a curated set of endpoints over HTTP (default exposes only /health).
management.endpoints.web.exposure.include=health,info,beans,conditions,env,mappings
management.endpoint.health.show-details=always
# Surface app metadata at /actuator/info
management.info.env.enabled=true
info.app.name=TaskFlow
info.app.description=Spring Boot deep-dive bootcamp capstone

# --- Spring AI (Anthropic / Claude) ---
# Set ANTHROPIC_API_KEY in your environment before calling POST /tasks/prioritize.
# The placeholder default lets the context start without a key (the call fails
# only when actually invoked without a real key).
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:not-set}
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-sonnet-4-6}
spring.ai.anthropic.chat.options.temperature=0.2
